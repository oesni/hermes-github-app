version: 1
auth:
  app_id: 12345
  installation_id: 67890
  private_key_path: /srv/hermes-private/github-app.pem
policy:
  repositories:
    mode: all
    exclude: [acme/payroll, secret-org/*, acme/frozen]
  default_access: write
  allow_actions: []
  deny_actions: [pulls.merge]
  repository_rules:
    acme/archive:
      access: read
    acme/support:
      deny_actions: [branches.create]
    acme/inherits: {}
