[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-github-app"
version = "0.1.0"
description = "Policy-bound host GitHub App tools for Hermes"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "PyJWT[crypto]>=2.9,<3", "ruamel.yaml>=0.18,<0.19"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["hermes_github_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
hermes_github_app = ["compatibility.json"]
