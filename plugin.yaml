manifest_version: 2
name: hermes-github-app
version: 0.2.0
kind: standalone
description: Host-owned GitHub App credentials with per-repository action policy.
provides_tools:
  - repo_get
  - contents_read
  - issue_list
  - issue_get
  - issue_comments_list
  - issue_create
  - issue_comment
  - pr_list
  - pr_get
  - pr_comments_list
  - pr_create
  - pr_comment
  - branch_create
  - pr_merge
python_dependencies:
  - httpx>=0.27,<1
  - PyJWT[crypto]>=2.9,<3
  - ruamel.yaml>=0.18,<0.19
