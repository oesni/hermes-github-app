manifest_version: 2
name: hermes-github-app
version: 0.1.0
kind: standalone
description: Host-owned GitHub App credentials with per-repository action policy.
provides_tools:
  - github_repo_get
  - github_contents_read
  - github_issue_list
  - github_issue_get
  - github_issue_comments_list
  - github_issue_create
  - github_issue_comment
  - github_pr_list
  - github_pr_get
  - github_pr_comments_list
  - github_pr_create
  - github_pr_comment
  - github_pr_review_comment
  - github_branch_create
  - github_pr_merge
python_dependencies:
  - httpx>=0.27,<1
  - PyJWT[crypto]>=2.9,<3
  - ruamel.yaml>=0.18,<0.19
